<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康小助手 · 使用者模式</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="large-ui">
  <div class="topbar">
    <h1>🏥 健康小助手</h1>
    <div class="nav">
      <button class="sos-btn" id="sos-btn" title="一键紧急呼救">SOS</button>
    </div>
  </div>

  <div class="container" style="max-width:760px">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0">和我说说您哪里不舒服</h2>
        <label class="small" style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="voice-out" checked style="width:auto"> 语音播报
        </label>
      </div>
      <div class="chat-box" id="chat-box"></div>
      <div class="chips" id="chips"></div>
      <div class="form-row" style="margin-top:8px">
        <button class="btn ghost" id="mic-btn" style="font-size:22px;padding:12px 18px" title="按住说话">🎤</button>
        <input id="msg-input" placeholder="输入症状，如：膝盖疼、一走路就痛…" style="flex:3">
        <button class="btn primary" id="send-btn" style="flex:1">发送</button>
      </div>
    </div>

    <div class="card">
      <h2>📝 记录身体指标</h2>
      <div class="form-row">
        <select id="metric-type">
          <option value="blood_pressure_sys">血压（收缩压）</option>
          <option value="blood_pressure_dia">血压（舒张压）</option>
          <option value="blood_glucose">空腹血糖</option>
          <option value="temperature">体温</option>
          <option value="weight">体重</option>
          <option value="heart_rate">心率</option>
          <option value="blood_oxygen">血氧</option>
          <option value="steps">步数</option>
        </select>
        <input id="metric-value" type="number" placeholder="数值" style="flex:1">
        <button class="btn green" id="save-metric" style="flex:1">保存</button>
      </div>
      <p class="muted small" style="margin-bottom:0">也支持连接华为手环等设备自动同步（演示版由设备接口接收数据）。</p>
    </div>

    <div class="card">
      <h2>💊 今日提醒</h2>
      <div id="due-list" class="small muted">加载中…</div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/user.js"></script>
</body>
</html>
