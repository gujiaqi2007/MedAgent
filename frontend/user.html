<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能导诊 · 健康守护</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar"></div>
    <div class="main">
      <div class="topbar">
        <div>
          <h1>💬 AI 智能导诊</h1>
          <div class="sub">说说哪里不舒服，我会用大白话告诉您怎么办</div>
        </div>
        <button class="sos" id="sos-btn" title="一键紧急呼救">SOS</button>
      </div>

      <div class="content">
        <div class="card" style="padding-bottom:12px">
          <div class="chat-box" id="chat-box" style="height:46vh"></div>
          <div class="chat-input">
            <button class="mic" id="mic-btn" title="点击说话">🎤</button>
            <input id="msg-input" placeholder="例如：膝盖疼，一走路就痛">
            <button class="btn primary" id="send-btn">发送</button>
          </div>
          <div class="muted small" style="margin-top:8px">
            提示：可以先点下面的问题卡片选择答案；语音播报已把「120」读作「幺二零」。
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h2>📝 记录身体指标</h2>
            <div class="row">
              <select id="metric-type" style="flex:2">
                <option value="blood_pressure_sys">收缩压</option>
                <option value="blood_pressure_dia">舒张压</option>
                <option value="blood_glucose">空腹血糖</option>
                <option value="temperature">体温</option>
                <option value="weight">体重</option>
                <option value="heart_rate">心率</option>
                <option value="blood_oxygen">血氧</option>
                <option value="steps">步数</option>
              </select>
              <input id="metric-value" type="number" placeholder="数值" style="flex:1">
              <button class="btn green" id="save-metric">保存</button>
            </div>
            <div class="row" style="margin-top:12px">
              <button class="btn ghost" id="sync-btn">⌚ 同步手环数据</button>
              <span class="muted small" id="sync-status"></span>
            </div>
          </div>

          <div class="card">
            <h2>💊 今日提醒</h2>
            <div id="due-list" class="small muted">加载中…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/user.js"></script>
</body>
</html>
