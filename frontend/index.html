<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康守护 MedAgent</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center">
      <h1>✚ 健康守护</h1>
      <p class="sub">正在进入…</p>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    (function () {
      if (!API.token()) { location.replace('/login'); return; }
      const role = localStorage.getItem('medagent_role');
      location.replace(role === 'guardian' ? '/guardian' : role === 'doctor' ? '/doctor' : '/user');
    })();
  </script>
</body>
</html>
